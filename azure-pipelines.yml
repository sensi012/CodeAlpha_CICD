trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  acrName: 'codealphaisaiah.azurecr.io'
  imageName: 'codealpha-app'

steps:
  - task: Docker@2
    displayName: 'Build Docker Image'
    inputs:
      containerRegistry: 'codealphaisaiah.azurecr.io'  # Link to your ACR connection here too
      repository: '$(imageName)'            # Name the image 'codealpha-app'
      command: build
      dockerfile: '**/Dockerfile'
      tags: '$(Build.BuildId)'

  - task: Docker@2
    displayName: 'Push to Azure Container Registry'
    inputs:
      containerRegistry: 'codealphaisaiah'
      command: push
      repository: '$(imageName)'            # FIXED: Changed from $(dockerfile) to $(imageName)
      tags: '$(Build.BuildId)'