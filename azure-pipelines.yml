trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  acrName: 'codealphaisaiah.azurecr.io'
  imageName: 'codealpha-app'

steps:
  - task: Docker@2
    displayName: 'Build Docker Image'
    inputs:
      containerRegistry: 'codealphaisaiah'  # FIXED: Matches the Service Connection name
      repository: '$(imageName)'
      command: build
      dockerfile: '**/Dockerfile'
      tags: '$(Build.BuildId)'

  - task: Docker@2
    displayName: 'Push to Azure Container Registry'
    inputs:
      containerRegistry: 'codealphaisaiah'  # Matches the Service Connection name
      command: push
      repository: '$(imageName)'
      tags: '$(Build.BuildId)'